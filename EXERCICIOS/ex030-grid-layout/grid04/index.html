<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
        }

        .container1 {
            margin-bottom: 20px;
            border: 5px solid black;
            display: grid;
            grid-template-rows: 100px 100px 100px;
            grid-template-columns: 120px 120px 120px;

            grid-auto-flow: column;
            /*Esta aula tem dois objetivos,este comando e outro logo a baixo, este comando a cima faz com que o grid quebre em colunas e não em linha, observe a sequencia de A,B,C,D... e vejá que ele segue em forma de coluna.*/

            gap: 10px;

            place-items: normal normal;
            place-content: normal normal;
        }

        .container2 {
            border: 5px solid black;
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(3, 120px);

            grid-auto-flow: column;

            grid-auto-columns: 120px;
            /*Este comando ao ser inserido faz com que novas colunas que não foram explicitadas no comando grid-template-column tenham um tamanho pré definido.*/

            gap: 10px;

            place-items: normal normal;
            place-content: normal normal;
        }

        .item {
            border: 5px dashed green;
            padding: 5px;
        }

        .item1 {
            border: 5px dashed green;
            padding: 5px;
            background-color: rgb(255, 152, 152);
        }

        .item2 {
            border: 5px dashed green;
            padding: 5px;
            background-color: rgb(202, 255, 202);
        }
    </style>
</head>

<body>
    <div class="container1">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item1">J</div>

    </div>

    <div class="container2">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item2">J</div>

    </div>


</body>

</html>
