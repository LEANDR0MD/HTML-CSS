<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
        }

        .container {
            margin-bottom: 10px;
            border: 5px solid black;
            height: 500px;
            display: grid;

            grid-template: 1fr 1fr 1fr/ 1fr 1fr 1fr;
            /*Nesta aula o objetivo é demonstar as unidades fracionais*/


            gap: 10px;

            place-items: normal normal;
            place-content: normal normal;
        }

        .container1 {
            margin-bottom: 10px;
            border: 5px solid black;
            height: 500px;
            display: grid;

            grid-template: 1fr 1fr 1fr/ 3fr 1fr 1fr;
            /*Nesta aula o objetivo é demonstar as unidades fracionais*/


            gap: 10px;

            place-items: normal normal;
            place-content: normal normal;
        }

        .container2 {
            margin-bottom: 10px;
            border: 5px solid black;
            height: 500px;
            display: grid;

            grid-template: 1fr 3fr 1fr/ 1fr 1fr 1fr;
            /*Nesta aula o objetivo é demonstar as unidades fracionais*/


            gap: 10px;

            place-items: normal normal;
            place-content: normal normal;
        }

        .container3 {

            border: 5px solid black;
            height: 500px;
            display: grid;

            grid-template: 1fr 1fr 1fr/ 1fr 1fr 1fr;
            /*Nesta aula o objetivo é demonstar as unidades fracionais*/


            gap: 10px;

            place-items: start start;
            place-content: normal normal;
        }



        .item {
            border: 5px dashed green;
            padding: 5px;
        }

        #A01 {
            width: 100px;
            height: 100px;
        }

        #A02 {
            width: 100px;

        }

        #A05 {
            width: 300px;
            height: 200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>

    <div class="container1">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>

    <div class="container2">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>

    <div class="container3">
        <div class="item" id="A01">A</div>
        <div class="item" id="A02">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item" id="A05">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>


</body>

</html>
